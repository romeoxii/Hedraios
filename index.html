        <meta name="viewport" content="width=device-width, initial-scale=1.0" />

            content="Hedraios — daily documentation and faith tracking: journal, prayers, and scripture readings, offline-first."

        <meta name="mobile-web-app-capable" content="yes" />

            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@400;500&display=swap"
            rel="stylesheet"
        />
        <script>
            // Picks light or dark before anything shows, so no white flash.
            try {
                var t = localStorage.getItem("hedraios-theme");
                if (t !== "light" && t !== "dark") {
                    t = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
                }
                document.documentElement.dataset.theme = t;
            } catch (e) {}
        </script>
        <title>Hedraios</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
