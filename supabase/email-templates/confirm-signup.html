<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Confirm your Hedraios account</title>
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            font-family: -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;
        "
    >
        <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="background-color: #fafafa; padding: 40px 16px"
        >
            <tr>
                <td align="center">
                    <table
                        role="presentation"
                        width="480"
                        cellpadding="0"
                        cellspacing="0"
                        style="
                            background-color: #ffffff;
                            border: 1px solid #e5e7eb;
                            border-radius: 16px;
                            padding: 40px 32px;
                            max-width: 100%;
                        "
                    >
                        <tr>
                            <td
                                align="center"
                                style="
                                    font-size: 22px;
                                    font-weight: 800;
                                    letter-spacing: -0.02em;
                                    color: #0e9f6e;
                                "
                            >
                                Hedraios
                            </td>
                        </tr>
                        <tr>
                            <td
                                align="center"
                                style="
                                    padding-top: 16px;
                                    font-size: 18px;
                                    font-weight: 600;
                                    color: #1c1c1e;
                                "
                            >
                                One tap to confirm
                            </td>
                        </tr>
                        <tr>
                            <td
                                align="center"
                                style="
                                    padding-top: 8px;
                                    font-size: 14px;
                                    line-height: 1.6;
                                    color: #6b7280;
                                "
                            >
                                You created an account as {{ .Email }}. Confirm it below, then sign
                                in with your password.
                            </td>
                        </tr>
                        <tr>
                            <td align="center" style="padding-top: 28px">
                                <a
                                    href="{{ .ConfirmationURL }}"
                                    style="
                                        display: inline-block;
                                        background-color: #3ecf8e;
                                        color: #06281c;
                                        font-size: 15px;
                                        font-weight: 600;
                                        text-decoration: none;
                                        padding: 12px 40px;
                                        border-radius: 999px;
                                    "
                                >
                                    Confirm account
                                </a>
                            </td>
                        </tr>
                        <tr>
                            <td
                                align="center"
                                style="
                                    padding-top: 24px;
                                    font-size: 12px;
                                    line-height: 1.6;
                                    color: #9ca3af;
                                "
                            >
                                Button not working? Paste this link into your browser:<br />
                                <a
                                    href="{{ .ConfirmationURL }}"
                                    style="color: #0e9f6e; word-break: break-all"
                                    >{{ .ConfirmationURL }}</a
                                >
                            </td>
                        </tr>
                        <tr>
                            <td
                                align="center"
                                style="padding-top: 16px; font-size: 12px; color: #9ca3af"
                            >
                                Didn&apos;t create an account? You can safely ignore this email.
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
