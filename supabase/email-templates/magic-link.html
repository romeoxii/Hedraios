<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Your Hedraios code</title>
    </head>
    <body
        style="
            margin: 0;
            padding: 0;
            background-color: #fafafa;
            font-family: -apple-system, &quot;Segoe UI&quot;, Roboto, Helvetica, Arial, sans-serif;
        "
    >
        <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            style="background-color: #fafafa; padding: 40px 16px"
        >
            <tr>
                <td align="center">
                    <table
                        role="presentation"
                        width="480"
                        cellpadding="0"
                        cellspacing="0"
                        style="
                            background-color: #ffffff;
                            border: 1px solid #e5e7eb;
                            border-radius: 16px;
                            padding: 40px 32px;
                            max-width: 100%;
                        "
                    >
                        <tr>
                            <td
                                align="center"
                                style="
                                    font-size: 22px;
                                    font-weight: 800;
                                    letter-spacing: -0.02em;
                                    color: #0e9f6e;
                                "
                            >
                                Hedraios
                            </td>
                        </tr>
                        <tr>
                            <td
                                align="center"
                                style="
                                    padding-top: 16px;
                                    font-size: 18px;
                                    font-weight: 600;
                                    color: #1c1c1e;
                                "
                            >
                                Your sign-in code
                            </td>
                        </tr>
                        <tr>
                            <td
                                align="center"
                                style="
                                    padding-top: 8px;
                                    font-size: 14px;
                                    line-height: 1.6;
                                    color: #6b7280;
                                "
                            >
                                Enter this code in the app to sign in as {{ .Email }}. It expires
                                soon and can only be used once.
                            </td>
                        </tr>
                        <tr>
                            <td
                                align="center"
                                style="
                                    padding-top: 24px;
                                    font-size: 36px;
                                    font-weight: 800;
                                    letter-spacing: 0.25em;
                                    color: #1c1c1e;
                                "
                            >
                                {{ .Token }}
                            </td>
                        </tr>
                        <tr>
                            <td
                                align="center"
                                style="padding-top: 24px; font-size: 12px; color: #9ca3af"
                            >
                                Didn&apos;t ask for this? You can safely ignore this email.
                            </td>
                        </tr>
                    </table>
                </td>
            </tr>
        </table>
    </body>
</html>
